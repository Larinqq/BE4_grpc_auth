worker_processes auto;

events {
  worker_connections 768;
  # multi_accept on;
}

http {

  resolver 127.0.0.11 valid=5s;

  charset utf-8;
  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;
  server_tokens off;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  access_log /var/log/nginx/access.log;
  # error_log /var/log/nginx/error.log debug;
  # log_format request_logging 'метод $request_method, upstream-адрес $upstream_addr'; # для теста баланса

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1100;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=shop_cache:10m max_size=100m inactive=60m use_temp_path=off;
  map $uri $disable_cache {
    ~^/api(/|$) 1;
    default 0;
  }

  map $request_method $backend_upstream {
    GET balance;
    default main;
  }

  upstream balance {
    server backend:8080 weight=2;
    server backend-ro1:8080 weight=1;
    server backend-ro2:8080 weight=1;
  }

  upstream main {
    server backend:8080;
  }

  server {
    listen 80;
    server_name shopapi;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name shopapi;
    ssl_certificate /etc/nginx/ssl/shopapi.crt;
    ssl_certificate_key /etc/nginx/ssl/shopapi.key;

    root /var/shopapi/html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_cache shop_cache;
    proxy_cache_methods GET;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 301 302 10m;
    proxy_no_cache $disable_cache;
    proxy_cache_bypass $disable_cache;

    location / {
      index index.html
      try_files $uri $uri/ =404;
    }

    location = /api/v1 {
      return 301 /api/v1/swagger/index.html;
    }

    location /api {
      # access_log /dev/stdout request_logging; # для теста баланса
      proxy_pass http://$backend_upstream;
    }

    location /admin {
      proxy_pass http://pgadmin:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Script-Name /admin;
      proxy_redirect off;
    }

    location = /status {
      stub_status on;
      access_log off;
    }

  }
}
