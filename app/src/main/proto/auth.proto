syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/descriptor.proto";

option java_multiple_files = true;
option java_package = "ganisrum.backend.authserver.grpc";
option java_outer_classname = "AuthServiceProto";

extend google.protobuf.MethodOptions {
  bool requires_auth = 50001;
}

/*
* Ожидаемые метаданные (Metadata) для
*   методов с option (requires_auth) = true :
*   "Authorization": JWT-токен пользователя в формате "Bearer <token>"
*/
service AuthService {
  rpc Register (RegisterRequest) returns (TokenResponse);
  rpc Login (LoginRequest) returns (TokenResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ActionResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (ActionResponse){
    option (requires_auth) = true;
  }
  rpc ValidateToken (google.protobuf.Empty) returns (ValidateTokenResponse){
    option (requires_auth) = true;
  }
  rpc UpdateAccessToken (RefreshTokenRequest) returns (TokenResponse);
  rpc UpdateRefreshToken (RefreshTokenRequest) returns (TokenResponse);
}

message RegisterRequest {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  string phone_number = 4;
  string password = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ResetPasswordRequest {
  string email = 1;
}

message TokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
}

message ActionResponse {
  string message = 1;
}

message ValidateTokenResponse {
  bool is_valid = 1;
  string email = 2;
}

message RefreshTokenRequest{
  string refresh_token = 1;
}